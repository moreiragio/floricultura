<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Flores - Floricultura Flores & Cores</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/estilo.css}">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: 20px auto; padding: 10px; }
        h2 { text-align: center; margin-bottom: 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) { background-color: #f9f9f9; }

        .btn-acao {
            padding: 6px 10px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: 0.3s;
            display: inline-block;
            margin: 2px;
        }

        .btn-editar { background-color: #28a745; }
        .btn-editar:hover { background-color: #218838; }

        .btn-aumentar { background-color: #17a2b8; }
        .btn-aumentar:hover { background-color: #138496; }

        .btn-diminuir { background-color: #ffc107; color: black; }
        .btn-diminuir:hover { background-color: #e0a800; }

        .btn-excluir { background-color: #dc3545; }
        .btn-excluir:hover { background-color: #c82333; }

        header {
            background-color: #4CAF50;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 a {
            color: white;
            text-decoration: none;
        }

        .nav-central a {
            margin-left: 15px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <h1><a th:href="@{/inicio}">Floricultura Flores & Cores</a></h1>
    <nav class="nav-central">
        <a th:href="@{/flor/novo}">Cadastrar Flor</a>
        <a th:href="@{/paginaFuncionario}">Página do Funcionário</a>
    </nav>
</header>

<div class="container">
    <h2>Lista de Flores</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Quantidade</th>
            <th>Valor (R$)</th>
            <th>Cor</th>
            <th>Descrição</th>
            <th>Funcionário</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- Exibe as flores cadastradas -->
        <tr th:each="flor : ${flores}">
            <td th:text="${flor.id}"></td>
            <td th:text="${flor.nome}"></td>
            <td th:text="${flor.quantidade}"></td>
            <td th:text="${#numbers.formatDecimal(flor.valor, 1, 2)}"></td>
            <td th:text="${flor.cor}"></td>
            <td th:text="${flor.descricao}"></td>
            <td th:text="${flor.funcionario != null ? flor.funcionario.nome : '---'}"></td>
            <td>
                <a th:href="@{/flor/editar/{id}(id=${flor.id})}" class="btn-acao btn-editar">Editar</a>
                <a th:href="@{/flor/aumentar/{id}(id=${flor.id})}" class="btn-acao btn-aumentar">+</a>
                <a th:href="@{/flor/diminuir/{id}(id=${flor.id})}" class="btn-acao btn-diminuir">-</a>
                <a th:href="@{/flor/deletar/{id}(id=${flor.id})}"
                   class="btn-acao btn-excluir"
                   onclick="return confirm('Tem certeza que deseja excluir esta flor?');">
                    Excluir
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(flores)}">
            <td colspan="8">Nenhuma flor cadastrada.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
