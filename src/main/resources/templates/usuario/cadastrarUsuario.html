<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Floricultura Flores & Cores</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{../estilo.css}">
    <style>
        .modal-sucesso {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }
        .modal-conteudo {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 350px;
        }
        .modal-conteudo h2 { color: #4CAF50; margin-bottom: 15px; }
        .modal-conteudo button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .modal-conteudo button:hover { background-color: #45a049; }
    </style>
</head>
<body class="teste">

<header>
    <h1><a th:href="@{/}" style="text-decoration: none; color: white;">Floricultura Flores & Cores</a></h1>
    <nav class="nav-central">
        <a th:href="@{/login}">Login</a>
    </nav>
</header>

<form class="container-cadastro" th:action="@{/usuarios/salvar}" method="POST" th:object="${usuario}">
    <fieldset class="campo">
        <legend>Informações Pessoais</legend>
        <div class="campo-grupo">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>
            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>
            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" th:field="*{telefone}" required>
            </div>
            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" th:field="*{senha}" required>
            </div>
            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" th:field="*{cpf}" required>
            </div>
        </div>
    </fieldset>

    <fieldset class="campo">
        <legend>Endereço</legend>
        <div class="campo-grupo">
            <div class="campo">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" th:field="*{cep}" required>
            </div>
            <div class="campo">
                <label for="rua">Rua:</label>
                <input type="text" id="rua" th:field="*{rua}" required>
            </div>
            <div class="campo">
                <label for="numero">Número:</label>
                <input type="text" id="numero" th:field="*{numero}" required>
            </div>
            <div class="campo">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" th:field="*{bairro}" required>
            </div>
            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" th:field="*{cidade}" required>
            </div>
            <div class="campo">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" th:field="*{estado}" required>
            </div>
            <div class="campo">
                <label for="complemento">Complemento:</label>
                <input type="text" id="complemento" th:field="*{complemento}">
            </div>
        </div>
    </fieldset>

    <input type="hidden" th:field="*{tipoUsuario}" value="comum">

    <button type="submit">Cadastrar</button>
</form>

<div class="modal-sucesso" id="modalSucesso" th:if="${sucesso}">
    <div class="modal-conteudo">
        <h2>Usuário Cadastrado Com Sucesso!</h2>
        <button onclick="window.location.href='../login'">OK</button>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const sucesso = /*[[${sucesso}]]*/ false;
    if (sucesso) {
        document.getElementById("modalSucesso").style.display = "flex";
    }
    /*]]>*/
</script>

</body>
</html>
